<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de Cliente | Doce Magia</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" href="../../css/main.css">
	<link rel="stylesheet" href="../../css/cliente/c_cadastro.css">
</head>
<body>
	<header class="header_cadastro_cliente">
		<a class="marca_cliente" href="c_dashboard.html">
			<i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
			<span>Doce Magia</span>
		</a>
		<nav class="menu_cadastro_cliente" aria-label="Navegação do cliente">
			<a href="c_dashboard.html"><i class="fa-solid fa-store" aria-hidden="true"></i> Vitrine</a>
			<a class="ativo" href="c_cadastro.html" aria-current="page"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> Cadastro</a>
			<a href="../../index.html"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Sair</a>
		</nav>
	</header>

	<main class="pagina_cadastro_cliente">
		<div class="titulo_cadastro_cliente">
			<a href="c_dashboard.html" class="voltar_cadastro_cliente" aria-label="Voltar à vitrine" title="Voltar à vitrine">
				<i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
			</a>
			<div>
				<p class="sobretitulo_cadastro_cliente">DOCE MAGIA</p>
				<h1>Cadastro de cliente</h1>
				<p>Preencha seus dados para fazer parte da nossa doceria.</p>
			</div>
		</div>

		<form id="formCadastroCliente" class="form_cadastro_cliente">
			<div class="campo_cadastro_cliente">
				<label for="nome">Nome completo *</label>
				<input type="text" id="nome" name="nome" maxlength="150" autocomplete="name" required>
			</div>
			<div class="campo_cadastro_cliente">
				<label for="cpf">CPF *</label>
				<input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>
			</div>
			<div class="campo_cadastro_cliente">
				<label for="telefone">Telefone *</label>
				<input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(00) 00000-0000" autocomplete="tel" required>
			</div>
			<div class="campo_cadastro_cliente">
				<label for="email">E-mail *</label>
				<input type="email" id="email" name="email" maxlength="150" autocomplete="email" required>
			</div>

			<div id="mensagemCadastroCliente" class="mensagem_cadastro_cliente" aria-live="polite"></div>

			<div class="acoes_cadastro_cliente">
				<a href="c_dashboard.html" class="cancelar_cadastro_cliente">Cancelar</a>
				<button type="submit" id="btnSalvarCadastroCliente">
					<i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
					Salvar cadastro
				</button>
			</div>
		</form>
	</main>

	<footer class="rodape">
		<p>Doce Magia — Doces artesanais feitos com carinho</p>
		<p>© 2026 Todos os direitos reservados</p>
	</footer>

	<script src="../../scripts/atendente-utils.js"></script>
	<script src="../../scripts/cliente/c_cadastro.js"></script>
</body>
</html>

<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../../css/produtor/produtor.css">

<body>

    <div class="barra_navegacao">

            <i class="fa-solid fa-cookie-bite"></i>

        </div>
        <div class="sair">
            <a href="../../index.html">Sair</a>
        </div>
    </div>

    <div id="main_atendente">

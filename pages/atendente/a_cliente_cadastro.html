<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Novo Cliente - Doce Magia</title>
	<link rel="stylesheet" href="../../css/main.css">
	<link rel="stylesheet" href="../../css/atendente/a_clientes.css">
	<script src="https://kit.fontawesome.com/9fcac6d441.js" crossorigin="anonymous"></script>
</head>
<body data-pagina="cadastro">
	<header>
		<nav class="barra_navegacao">
			<div class="titulo_principal">
				<i class="fa-solid fa-wand-magic-sparkles"></i>
				<h1>DOCE MAGIA</h1>
			</div>
			<div class="sair">
				<a href="../../index.html">Sair</a>
			</div>
		</nav>
		<nav class="submenu_atendente">
			<ul>
				<li>
					<a href="a_dashboard.html">
						<i class="fa-solid fa-house"></i>
						Dashboard
					</a>
				</li>
				<li>
					<a class="selecionado" href="a_clientes.html">
						<i class="fa-solid fa-users"></i>
						Clientes
					</a>
				</li>
			</ul>
		</nav>
	</header>

	<main class="container cadastro_cliente">
		<section class="cabecalho">
			<h2>Novo Cliente</h2>
			<p>Preencha os dados para cadastrar um cliente na Doce Magia.</p>
		</section>

		<form id="formCliente" class="form_cliente">
			<div class="campo_cliente">
				<label for="nome">Nome completo *</label>
				<input type="text" id="nome" name="nome" maxlength="150" autocomplete="name" required>
			</div>
			<div class="campo_cliente">
				<label for="cpf">CPF *</label>
				<input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>
			</div>
			<div class="campo_cliente">
				<label for="telefone">Telefone *</label>
				<input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(00) 00000-0000" autocomplete="tel" required>
			</div>
			<div class="campo_cliente">
				<label for="email">E-mail *</label>
				<input type="email" id="email" name="email" maxlength="150" autocomplete="email" required>
			</div>

			<div id="mensagem" class="mensagem" aria-live="polite"></div>

			<div class="botoes_cadastro">
				<a class="botao_cancelar" href="a_clientes.html">Cancelar</a>
				<button type="submit" class="botao_salvar" id="btnSalvarCliente">
					<i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
					Salvar Cliente
				</button>
			</div>
		</form>
	</main>

	<footer class="rodape">
		<p>© 2026 Doce Magia</p>
		<p>Sistema da Doceria</p>
		<p>Site criado para fins pedagógicos</p>
	</footer>

	<script src="../../scripts/atendente-utils.js"></script>
	<script src="../../scripts/a_clientes.js"></script>
</body>
</html>

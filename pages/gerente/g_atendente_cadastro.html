<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastrar Atendente | Doce Magia</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<link rel="stylesheet" href="../../css/main.css">
	<link rel="stylesheet" href="../../css/gerente/g_paginas.css">
	<link rel="stylesheet" href="../../css/gerente/g_atendente_cadastro.css">
</head>
<body>
	<header class="barra_navegacao">
		<div class="titulo_principal">
			<i class="fa-solid fa-wand-magic-sparkles"></i>
			<h1>Doce Magia</h1>
			<span class="divisor"></span>
			<div class="usuario_logado">
				<i class="fa-solid fa-shield-halved"></i>
				<span>Gerente</span>
			</div>
		</div>
		<div class="sair">
			<span class="modulo_atual">MÓDULO ADMINISTRATIVO</span>
			<a href="../../index.html" class="botao_sair">
				<i class="fa-solid fa-right-from-bracket"></i>
				Sair
			</a>
		</div>
	</header>

	<nav class="submenu_atendente" aria-label="Navegação do módulo gerente">
		<ul>
			<li><a href="g_dashboard.html"><i class="fa-solid fa-grip"></i> Dashboard</a></li>
			<li><a href="g_estoque.html"><i class="fa-solid fa-cube"></i> Estoque</a></li>
			<li><a href="g_produtos.html"><i class="fa-solid fa-cake-candles"></i> Produtos</a></li>
			<li><a href="g_relatorios.html"><i class="fa-solid fa-chart-simple"></i> Relatórios</a></li>
			<li><a href="g_alertas.html"><i class="fa-solid fa-bell"></i> Alertas</a></li>
		</ul>
	</nav>

	<main class="conteudo cadastro_atendente">
		<div class="cabecalho_formulario_atendente">
			<a class="voltar_atendente" href="g_dashboard.html" aria-label="Voltar ao dashboard" title="Voltar ao dashboard">
				<i class="fa-solid fa-arrow-left"></i>
			</a>
			<div class="cabecalho_pagina">
				<h1>Cadastrar atendente</h1>
				<p>Informe os dados de acesso e contato do novo atendente.</p>
			</div>
		</div>

		<form id="formAtendente" class="form_atendente">
			<div class="campo_atendente">
				<label for="nome">Nome completo *</label>
				<input type="text" id="nome" name="nome" maxlength="150" autocomplete="name" required>
			</div>
			<div class="campo_atendente">
				<label for="cpf">CPF *</label>
				<input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" autocomplete="off" required>
			</div>
			<div class="campo_atendente">
				<label for="telefone">Telefone *</label>
				<input type="tel" id="telefone" name="telefone" maxlength="20" placeholder="(00) 00000-0000" autocomplete="tel" required>
			</div>
			<div class="campo_atendente">
				<label for="email">E-mail *</label>
				<input type="email" id="email" name="email" maxlength="150" autocomplete="email" required>
			</div>
			<div class="campo_atendente">
				<label for="senha">Senha *</label>
				<input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required>
				<small>Mínimo de 8 caracteres.</small>
			</div>
			<div class="campo_atendente">
				<label for="confirmarSenha">Confirmar senha *</label>
				<input type="password" id="confirmarSenha" name="confirmarSenha" minlength="8" autocomplete="new-password" required>
			</div>

			<div id="mensagemAtendente" class="mensagem_atendente" aria-live="polite"></div>

			<div class="acoes_formulario_atendente">
				<a class="cancelar_atendente" href="g_dashboard.html">Cancelar</a>
				<button class="btn_primario" type="submit" id="btnSalvarAtendente">
					<i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
					Salvar atendente
				</button>
			</div>
		</form>
	</main>

	<footer class="rodape">
		<p>Doce Magia — Sistema de Gestão</p>
		<p>© 2026 Todos os direitos reservados</p>
	</footer>

	<script src="../../scripts/atendente-utils.js"></script>
	<script src="../../scripts/gerente_atendente_cadastro.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro de Produtos - Doce Magia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #FFF8E7, #FFE4B5);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(139, 69, 19, 0.15);
        }

        h1 {
            color: #8B4513;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        label .required {
            color: #dc3545;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: #fafafa;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #8B4513;
            background: white;
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-group {
            display: flex;
            gap: 25px;
            padding: 10px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            cursor: pointer;
            transform: scale(1.3);
        }

        .checkbox-item span {
            color: #333;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B4513, #A0522D);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 69, 19, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .mensagem {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mensagem.sucesso {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
            display: block;
        }

        .mensagem.erro {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
            display: block;
        }

        .mensagem.info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cadastro de Produtos</h1>
        <p class="subtitle">Preencha os dados do produto para cadastrá-lo:</p>

        <div id="mensagem" class="mensagem"></div>

        <form id="formProduto">
    
            <div class="form-group">
                <label for="nome">
                    Nome do Produto <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="nome" 
                    name="nome"
                    placeholder="Ex: Bolo de Chocolate Belga"
                    required
                    maxlength="200"
                />
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea 
                    id="descricao" 
                    name="descricao"
                    placeholder="Descreva o produto..."
                    maxlength="1000"
                ></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="preco">
                        Preço (R$) <span class="required">*</span>
                    </label>
                    <input 
                        type="number" 
                        id="preco" 
                        name="preco"
                        placeholder="0.00"
                        step="0.01"
                        min="0.01"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="precoPromocional">Preço Promocional (R$)</label>
                    <input 
                        type="number" 
                        id="precoPromocional" 
                        name="precoPromocional"
                        placeholder="0.00"
                        step="0.01"
                        min="0"
                    />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tempoPreparo">
                        Tempo de Preparo (min) <span class="required">*</span>
                    </label>
                    <input 
                        type="number" 
                        id="tempoPreparo" 
                        name="tempoPreparo"
                        placeholder="Ex: 60"
                        min="1"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="categoriaId">
                        Categoria <span class="required">*</span>
                    </label>
                    <select id="categoriaId" name="categoriaId" required>
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="ingredientes">Ingredientes</label>
                <textarea 
                    id="ingredientes" 
                    name="ingredientes"
                    placeholder="Ex: Farinha, Ovos, Chocolate, Manteiga..."
                    maxlength="1000"
                ></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="peso">Peso</label>
                    <input 
                        type="text" 
                        id="peso" 
                        name="peso"
                        placeholder="Ex: 1.2kg"
                        maxlength="50"
                    />
                </div>

                <div class="form-group">
                    <label for="imagem">Nome da Imagem</label>
                    <input 
                        type="text" 
                        id="imagem" 
                        name="imagem"
                        placeholder="Ex: bolo-chocolate.jpg"
                        maxlength="255"
                    />
                </div>
            </div>

            <div class="form-group">
                <label>Opções</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="destaque" name="destaque" />
                        <span>Destaque! c:</span>
                    </label>

                    <label class="checkbox-item">
                        <input type="checkbox" id="disponivel" name="disponivel" checked />
                        <span> Disponível</span>
                    </label>
                </div>
            </div>

            <!-- BOTÕES -->
            <div class="btn-group">
                <button type="button" class="btn-secondary" onclick="limparFormulario()">
                     Limpar
                </button>
                <button type="submit" class="btn-primary" id="btnEnviar">
                     Cadastrar Produto
                </button>
            </div>
        </form>
    </div>

    <script>
 
        const API_URL = 'http://10.124.75.2:8080/api/v1';

        const form = document.getElementById('formProduto');
        const mensagem = document.getElementById('mensagem');
        const btnEnviar = document.getElementById('btnEnviar');
        const selectCategoria = document.getElementById('categoriaId');

        function mostrarMensagem(texto, tipo = 'sucesso') {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;

            if (tipo !== 'erro') {
                setTimeout(() => {
                    mensagem.className = 'mensagem';
                }, 5000);
            }
        }

        async function carregarCategorias() {
            try {
                const resposta = await fetch(`${API_URL}/categorias/ativas`);

                if (!resposta.ok) {
                    throw new Error(`HTTP ${resposta.status}`);
                }

                const categorias = await resposta.json();

                selectCategoria.innerHTML = '<option value="">Selecione uma categoria</option>';

                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = `${cat.icone || '📦'} ${cat.nome}`;
                    selectCategoria.appendChild(option);
                });

                console.log(`✅ ${categorias.length} categorias carregadas`);

            } catch (erro) {
                console.error('❌ Erro ao carregar categorias:', erro);
                selectCategoria.innerHTML = '<option value="">❌ Erro ao carregar categorias</option>';
                mostrarMensagem('Erro ao carregar categorias. Verifique se o back-end está rodando.', 'erro');
            }
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            btnEnviar.disabled = true;
            btnEnviar.innerHTML = '<span class="spinner"></span> Cadastrando...';

            try {

                const dados = {
                    nome: document.getElementById('nome').value.trim(),
                    descricao: document.getElementById('descricao').value.trim() || null,
                    preco: parseFloat(document.getElementById('preco').value),
                    precoPromocional: document.getElementById('precoPromocional').value 
                        ? parseFloat(document.getElementById('precoPromocional').value) 
                        : null,
                    tempoPreparo: parseInt(document.getElementById('tempoPreparo').value),
                    categoriaId: parseInt(document.getElementById('categoriaId').value),
                    ingredientes: document.getElementById('ingredientes').value.trim() || null,
                    peso: document.getElementById('peso').value.trim() || null,
                    imagem: document.getElementById('imagem').value.trim() || null,
                    destaque: document.getElementById('destaque').checked,
                    disponivel: document.getElementById('disponivel').checked
                };

                if (!dados.nome) {
                    throw new Error('O nome do produto é obrigatório');
                }

                if (!dados.preco || dados.preco <= 0) {
                    throw new Error('O preço deve ser maior que zero');
                }

                if (!dados.tempoPreparo || dados.tempoPreparo <= 0) {
                    throw new Error('O tempo de preparo deve ser maior que zero');
                }

                if (!dados.categoriaId) {
                    throw new Error('Selecione uma categoria');
                }

                if (dados.precoPromocional && dados.precoPromocional >= dados.preco) {
                    throw new Error('O preço promocional deve ser menor que o preço normal');
                }

                console.log(' Enviando dados:', dados);

                const resposta = await fetch(`${API_URL}/produtos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                if (!resposta.ok) {

                    let mensagemErro = `Erro HTTP ${resposta.status}`;
                    
                    try {
                        const erroData = await resposta.json();
                        if (erroData.message) {
                            mensagemErro = erroData.message;
                        } else if (erroData.errors) {
                            mensagemErro = Object.values(erroData.errors).join(', ');
                        }
                    } catch (e) {

                    }
                    
                    throw new Error(mensagemErro);
                }

                const produtoCriado = await resposta.json();
                console.log('✅ Produto criado:', produtoCriado);

                mostrarMensagem(
                    `✅ Produto "${produtoCriado.nome}" cadastrado com sucesso! (ID: ${produtoCriado.id})`,
                    'sucesso'
                );

                limparFormulario();

            } catch (erro) {
                console.error('❌ Erro:', erro);
                mostrarMensagem(`❌ ${erro.message}`, 'erro');
            } finally {
                // Reabilita o botão
                btnEnviar.disabled = false;
                btnEnviar.innerHTML = ' Cadastrar Produto';
            }
        });

        function limparFormulario() {
            form.reset();
            
            // Mantém "disponível" marcado por padrão
            document.getElementById('disponivel').checked = true;
            document.getElementById('destaque').checked = false;
            
            document.getElementById('nome').focus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log(' Cadastro de Produtos iniciado');
            carregarCategorias();
        });
    </script>
</body>
</html>
